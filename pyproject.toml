[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "pycurb"
version = "0.2.1"
description = "A framework-agnostic Python rate limit library"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [
    {name = "Oluwaseun Ogunsanu", email = "ogunsanu17@gmail.com"}
]
classifiers = [
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "build>=1.5.0",
    "httpx2>=2.4.0",
    "matplotlib>=3.10.9",
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.5",
    "mkdocstrings-python-xref>=2.1.1",
    "numpy>=2.2.6",
    "pytest>=9.0.3",
    "pytest-asyncio>=1.4.0",
    "pytest-benchmark[histogram]>=5.2.3",
    "pytest-django>=4.12.0",
    "ruff>=0.15.18",
    "twine>=6.2.0",
]

[project.optional-dependencies]
fastapi = [
    "fastapi>=0.137.0",
    "starlette>=1.0.0"
]
django = ["django>=5.2.15"]
flask = [
    "flask>=3.0.0",
    "flask-login>=0.6.3"
]
redis = ["redis>=8.0.0"]
all = [
    "pycurb[redis]",
    "pycurb[fastapi]",
    "pycurb[django]",
    "pycurb[flask]"
]
docs = [
    "mkdocs>=1.6.1",
    "mkdocs-git-revision-date-localized-plugin>=1.5.3",
    "mkdocs-material>=9.7.6",
    "mkdocstrings-python>=2.0.5",
    "mkdocstrings-python-xref>=2.1.1",
    "ruff>=0.15.18"
]

[project.urls]
Homepage = "https://github.com/fore-site/pycurb"
Repository = "https://github.com/fore-site/pycurb"
Documentation = "https://pycurb.readthedocs.io/"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pycurb*"]

[tool.setuptools.package-data]
pycurb = ["py.typed"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
addopts = "-q"
markers = [
    "benchmark: performance benchmarks (deselect with '-m not benchmark')",
]

[tool.ruff]
# Docs contain illustrative code samples that were never formatter-managed.
extend-exclude = ["docs"]

[tool.ruff.lint]
# Pin the rule set explicitly. This matches ruff's classic default rule set
# (pycodestyle errors E4/E7/E9 + pyflakes F) that the codebase has always
# passed. Ruff 0.16 expanded its defaults to include isort (I), pyupgrade
# (UP), bugbear (B), etc.; adopting those is a separate project decision.
select = ["E4", "E7", "E9", "F"]

[tool.ruff.format]
docstring-code-format = true
docstring-code-line-length = 20
