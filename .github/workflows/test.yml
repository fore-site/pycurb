name: CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "docs/**"

jobs:
  lint:
    name: Lint & format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Run ruff
        run: |
          uv run ruff check .
          uv run ruff format --check .

  test:
    name: Test ${{ matrix.os }} / Python ${{ matrix.python-version }}
    needs: lint
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --group dev

      - name: Start Redis (Linux only)
        if: runner.os == 'Linux'
        run: |
          docker run -d --name redis -p 6379:6379 redis
          sleep 5

      - name: Run tests
        run: uv run pytest --ignore=tests/benchmark
        env:
          REDIS_HOST: localhost

      - name: Upload test results
        uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: pytest-results-${{ matrix.os }}-py${{ matrix.python-version }}
          path: .pytest_cache

  build:
    name: Build & check distribution
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          enable-cache: true

      - name: Build sdist and wheel
        run: uv build

      - name: Check distribution metadata
        run: uv run --group dev twine check dist/*
